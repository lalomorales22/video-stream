<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>avatar · video-stream</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    /* Transparent by default so OBS composites the avatar with no green screen.
       The preview backdrop is opt-in (toggle), so it never leaks into OBS. */
    body.preview-bg {
      background:
        linear-gradient(45deg, #14141a 25%, transparent 25%) -10px 0,
        linear-gradient(-45deg, #14141a 25%, transparent 25%) -10px 0,
        linear-gradient(45deg, transparent 75%, #14141a 75%),
        linear-gradient(-45deg, transparent 75%, #14141a 75%);
      background-size: 20px 20px;
      background-color: #0c0c0e;
    }
    #stage { position: fixed; inset: 0; z-index: 1; }
    #webcam, #srcimg { display: none; }

    /* Control bar — dims to near-invisible, reveals on hover. In OBS you never
       hover, so only the avatar shows. */
    .bar {
      position: fixed; z-index: 5; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
      padding: 8px 10px; border-radius: 14px;
      background: rgba(12,12,14,0.72); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: #ececf1;
      opacity: 0.12; transition: opacity .2s ease; max-width: 94vw;
    }
    .bar:hover, .bar.show { opacity: 1; }
    .bar button, .bar select, .bar label.file {
      font: inherit; color: #ececf1; background: #18181d;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
      padding: 7px 12px; cursor: pointer; white-space: nowrap;
    }
    .bar button:hover, .bar label.file:hover { background: #23232a; }
    .bar button.on { color: #4fd1c5; border-color: rgba(79,209,197,.5); background: rgba(79,209,197,.12); }
    .bar button.rec { color: #ff3d6e; border-color: rgba(255,61,110,.5); background: rgba(255,61,110,.12); }
    .bar input[type=file] { display: none; }

    #status {
      position: fixed; z-index: 6; top: 14px; left: 50%; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px; max-width: 90vw; text-align: center;
      background: rgba(12,12,14,0.82); border: 1px solid rgba(255,255,255,0.1);
      font: 500 12px/1.3 "IBM Plex Mono", ui-monospace, monospace; color: #c8c8d2;
      transition: opacity .3s ease;
    }
    #status.err { color: #ff8fa8; border-color: rgba(255,61,110,.4); }
    #status.hide { opacity: 0; pointer-events: none; }
    #fps {
      position: fixed; z-index: 6; top: 14px; right: 14px;
      font: 500 11px/1 "IBM Plex Mono", monospace; color: rgba(255,255,255,.35);
    }

    /* Gallery panel */
    .gallery {
      position: fixed; z-index: 7; top: 0; right: 0; height: 100%; width: 320px; max-width: 86vw;
      background: rgba(12,12,14,0.92); border-left: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px); display: flex; flex-direction: column;
      transform: translateX(0); transition: transform .25s ease;
      font: 400 13px/1.4 "IBM Plex Mono", ui-monospace, monospace; color: #ececf1;
    }
    .gallery.hidden { transform: translateX(100%); }
    .gallery-head { display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .gallery-head strong { font: 700 14px "Syne", sans-serif; letter-spacing: .02em; }
    .gallery-head button { background: none; border: none; color: #8b8b98; font-size: 16px; cursor: pointer; }
    .gallery-head button:hover { color: #ececf1; }
    .gallery-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .g-item { border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 12px; background: #18181d; }
    .g-item .g-name { font-weight: 600; margin-bottom: 6px; word-break: break-word; }
    .g-item .g-tags { color: #8b8b98; font-size: 11px; margin-bottom: 8px; }
    .g-item .g-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .g-item .g-actions button { font: 500 11px "IBM Plex Mono", monospace; color: #ececf1;
      background: #23232a; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
      padding: 5px 10px; cursor: pointer; }
    .g-item .g-actions button:hover { background: #2c2c34; }
    .g-item .g-actions .g-del { color: #ff8fa8; }
    .gallery-empty { color: #5c5c6a; text-align: center; padding: 24px 12px; }
    .gallery-foot { padding: 10px 16px; border-top: 1px solid rgba(255,255,255,0.08);
      color: #5c5c6a; font-size: 11px; }

    /* Rig Studio — wider than the gallery: it shows renders you have to judge,
       and one of them you click on to place the eyes. */
    .rig { width: 400px; }
    .rig-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex;
      flex-direction: column; gap: 14px; }
    .rig h4 { font: 700 12px "Syne", sans-serif; letter-spacing: .04em;
      text-transform: uppercase; color: #8b8b98; margin-bottom: 8px; }
    .rig p { color: #a0a0ad; font-size: 12px; line-height: 1.5; }
    .rig .muted { color: #5c5c6a; }
    .rig .warn { color: #ffcf8f; }
    .rig .bad { color: #ff8fa8; }
    .rig .good { color: #4fd1c5; }
    .rig button, .rig label.file, .rig input[type=text], .rig input[type=number] {
      font: 500 12px "IBM Plex Mono", ui-monospace, monospace; color: #ececf1;
      background: #18181d; border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .rig input[type=text], .rig input[type=number] { cursor: text; width: 100%; }
    .rig button:hover:not(:disabled), .rig label.file:hover { background: #23232a; }
    .rig button:disabled { opacity: .45; cursor: default; }
    .rig button.primary { background: rgba(79,209,197,.14); border-color: rgba(79,209,197,.5); color: #4fd1c5; }
    .rig input[type=file] { display: none; }
    .rig-drop { border: 1px dashed rgba(255,255,255,0.2); border-radius: 12px;
      padding: 20px 14px; text-align: center; color: #8b8b98; }
    .rig-drop.over { border-color: #4fd1c5; color: #4fd1c5; background: rgba(79,209,197,.06); }
    .rig-shots { display: flex; gap: 8px; }
    .rig-shots > * { flex: 1 1 0; min-width: 0; }  /* share the row, don't each take it */
    .rig-shots img { width: 100%; border-radius: 8px; background: #0c0c0e;
      border: 1px solid rgba(255,255,255,0.08); }
    .rig-kinds { display: flex; flex-wrap: wrap; gap: 6px; }
    .rig-kind { border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
      padding: 6px 11px; font: 500 11px "IBM Plex Mono", monospace; background: #18181d; cursor: pointer; }
    .rig-kind.on { color: #4fd1c5; border-color: rgba(79,209,197,.55); background: rgba(79,209,197,.12); }
    .rig-why { list-style: none; color: #8b8b98; font-size: 11px; line-height: 1.6; }
    .rig-why li::before { content: "· "; color: #4fd1c5; }
    .rig-face { position: relative; display: inline-block; width: 100%; }
    .rig-face img { width: 100%; border-radius: 8px; cursor: crosshair;
      border: 1px solid rgba(255,255,255,0.08); background: #0c0c0e; display: block; }
    .rig-pin { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
      border-radius: 50%; border: 2px solid #4fd1c5; background: rgba(79,209,197,.25);
      pointer-events: none; }
    .rig-pin.mouth { border-color: #ff9f6e; background: rgba(255,159,110,.25); }
    .rig-row { display: flex; gap: 8px; align-items: center; }
    .rig-row > * { flex: 1; }
    .rig-bar { height: 6px; border-radius: 999px; background: #23232a; overflow: hidden; }
    .rig-bar span { display: block; height: 100%; width: 0; background: #4fd1c5;
      transition: width .3s ease; }
    .rig-log { max-height: 116px; overflow-y: auto; font: 400 10.5px/1.6 "IBM Plex Mono", monospace;
      color: #6f6f7d; background: #121216; border-radius: 8px; padding: 8px 10px;
      white-space: pre-wrap; word-break: break-word; }
    .rig hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="webcam" autoplay playsinline muted></video>
  <!-- Live MJPEG source when driving the avatar from a camera stream (?src=…). -->
  <img id="srcimg" crossorigin="anonymous" alt="" />

  <div id="status">loading…</div>
  <div id="fps"></div>

  <!-- Gallery panel (slides in) -->
  <div id="gallery" class="gallery hidden">
    <div class="gallery-head">
      <strong>Gallery</strong>
      <button id="gallery-close" type="button" title="Close">✕</button>
    </div>
    <div id="gallery-list" class="gallery-list"></div>
    <div class="gallery-foot">Saved avatars live here — Load one, or copy its OBS URL.</div>
  </div>

  <!-- Rig Studio (slides in) -->
  <div id="rig" class="gallery rig hidden">
    <div class="gallery-head">
      <strong>Auto-rig</strong>
      <button id="rig-close" type="button" title="Close">✕</button>
    </div>
    <div class="rig-body" id="rig-body"></div>
    <div class="gallery-foot" id="rig-foot">Drop a raw .glb here and get a drivable VRM back.</div>
  </div>

  <div class="bar" id="bar">
    <button id="btn-track" type="button">Start tracking</button>
    <select id="src-select" title="Tracking source (local webcam or a camera stream)"></select>
    <label class="file" title="Load your own .vrm">Avatar<input id="vrm-file" type="file" accept=".vrm,.glb" /></label>
    <button id="btn-rig" type="button" title="Turn a raw unrigged .glb into a drivable VRM avatar">Auto-rig</button>
    <button id="btn-body" type="button" title="Track arms, legs & torso (needs your body in frame)">Full&nbsp;body</button>
    <button id="btn-mirror" class="on" type="button" title="Mirror like a selfie">Mirror</button>
    <button id="btn-bg" type="button" title="Preview backdrop (not shown in OBS)">Preview&nbsp;bg</button>
    <button id="btn-save" type="button" title="Save this avatar + setup to your gallery">Save</button>
    <button id="btn-gallery" type="button" title="Open your saved avatars">Gallery</button>
    <button id="btn-copy" type="button" title="Copy a ready-to-paste OBS Browser Source URL with the current setup">Copy&nbsp;OBS&nbsp;URL</button>
  </div>

  <!-- Boot setup + watchdog (classic script, so it runs even if the ES module fails
       to load — which is exactly when we need to tell the user something's wrong). -->
  <script>
    (function () {
      var obs = new URLSearchParams(location.search).has("obs");
      // In a normal browser show a backdrop + the controls so the page can't look
      // falsely blank. In OBS (?obs) stay transparent and let the bar auto-hide.
      if (!obs) {
        document.body.classList.add("preview-bg");
        var bar = document.getElementById("bar");
        if (bar) bar.classList.add("show");
        var bg = document.getElementById("btn-bg");
        if (bg) bg.classList.add("on");
      }
      window.__avatarBoot = false;
      setTimeout(function () {
        if (!window.__avatarBoot) {
          var s = document.getElementById("status");
          if (s) {
            s.className = "err";
            s.textContent =
              "Avatar engine didn't start. Open the console (⌥⌘J) for the error, " +
              "or re-run ./install-avatar.sh. Most often: a stale cached file — hard-reload (⇧⌘R).";
          }
        }
      }, 8000);
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three.module.js"
    }
  }
  </script>
  <script>window.ASSET_V = "{{ asset_v }}";</script>
  <script src="/static/js/bus.js?v={{ asset_v }}"></script>
  <script type="module" src="/static/js/avatar.js?v={{ asset_v }}"></script>
</body>
</html>
